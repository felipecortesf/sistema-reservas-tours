spring.application.name=ms-whatsapp
server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/whatsapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

whatsapp.token=${WHATSAPP_TOKEN:sandbox}
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN:reservatours2026}

telefono.felipe=+56971092149
telefono.kary=+56971092149

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Twilio
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
spring.jpa.open-in-view=false
# ms-whatsapp - Sistema de Reservas de Tours Rio de Janeiro
