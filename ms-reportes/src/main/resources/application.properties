spring.application.name=ms-reportes
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/reportes_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID:}
telefono.felipe=+56971092149

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.open-in-view=false
# ms-reportes - Sistema de Reservas de Tours Rio de Janeiro
