spring.application.name=ms-comunicacion-agencia
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/agencia_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID:}

telefono.felipe=+56971092149
telefono.kary=+5521985269851

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.open-in-view=false
# ms-comunicacion-agencia - Sistema de Reservas de Tours Rio de Janeiro
