spring.application.name=ms-notificaciones
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/notificaciones_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID:}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.open-in-view=false
# ms-notificaciones - Sistema de Reservas de Tours Rio de Janeiro

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-notificaciones
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.reservatours.msnotificaciones.kafka.ReservaEvent
